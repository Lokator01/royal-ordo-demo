<style>
/* ============ ДИЗАЙН-СИСТЕМА ============ */
:root{
  --graphite:#171717; --milk:#F5F2EC; --gold:#C5A477; --gold-deep:#A98649;
  --gold-soft:rgba(197,164,119,.4); --taupe:#A69B8B; --ink:#202020;
  --body:#4B463E; --line:rgba(32,32,32,.14); --line-l:rgba(245,242,236,.16);
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Golos Text',Verdana,sans-serif;
  --ease:cubic-bezier(.19,1,.22,1);
}
/* Полный сброс внешних отступов: сайт всегда от края до края, без светлой рамки */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
h1,h2,h3,p,figure{margin:0;padding:0}
html{scroll-behavior:smooth;background:var(--graphite)}
html,body{overflow-x:clip;width:100%}
body{margin:0;background:var(--milk);color:var(--body);font:400 16px/1.75 var(--sans);-webkit-font-smoothing:antialiased}
#root{margin:0;padding:0;min-height:100vh;width:100%}
::selection{background:var(--gold);color:#fff}
::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:var(--milk)}
::-webkit-scrollbar-thumb{background:#C9BEAC;border-radius:0}
a{color:inherit}
img{display:block}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
[id]{scroll-margin-top:86px}
.container{width:min(1280px,92vw);margin-inline:auto}
.sec{padding:clamp(84px,11vw,150px) 0}
.ph{width:100%;height:100%;background:linear-gradient(135deg,#3B372F,#211F1C)}
.skip{position:fixed;top:-100px;left:16px;z-index:200;background:var(--graphite);color:#fff;padding:12px 22px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-decoration:none;transition:top .3s}
.skip:focus{top:14px}

/* ============ ТИПОГРАФИКА ============ */
.h2{font:500 clamp(2.05rem,4.4vw,3.7rem)/1.1 var(--serif);text-transform:uppercase;letter-spacing:.02em;color:var(--ink)}
.h2 em{font-style:italic;font-weight:400;text-transform:none;color:var(--gold-deep)}
.lead{font-size:clamp(15px,1.3vw,17px);line-height:1.8;max-width:56ch}
.overline{display:flex;align-items:center;gap:16px;font:600 10.5px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--gold-deep);margin-bottom:28px}
.overline .oi{font:italic 500 15px var(--serif);letter-spacing:.06em;color:var(--gold)}
.overline::after{content:"";width:64px;height:1px;background:var(--gold);opacity:.6}
.overline.center{justify-content:center}
.overline.center::before{content:"";width:64px;height:1px;background:var(--gold);opacity:.6}
.on-dark .h2,.on-dark .h2 em{color:var(--milk)}
.on-dark .h2 em{color:var(--gold)}

/* ============ КНОПКИ ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:12px;height:56px;padding:0 30px;
  font:600 11px/1 var(--sans);letter-spacing:.24em;text-transform:uppercase;text-decoration:none;
  border:1px solid transparent;cursor:pointer;white-space:nowrap;user-select:none;
  transition:background .35s ease,color .35s ease,border-color .35s ease,transform .2s ease}
.btn:active{transform:translateY(1px)}
.btn-solid{background:var(--milk);color:var(--ink)}
.btn-solid:hover{background:var(--gold);color:#171717}
.btn-ghost{border-color:rgba(255,255,255,.5);color:#fff}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold)}
.btn-gold{background:var(--gold);color:#171717}
.btn-gold:hover{background:#D5B98F}
.btn-sm{height:48px;padding:0 24px;font-size:10px;letter-spacing:.2em}
.tlink{display:inline-flex;align-items:center;gap:10px;font:600 11px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold-deep);text-decoration:none;border-bottom:1px solid var(--gold-soft);padding-bottom:9px;transition:color .3s,border-color .3s}
.tlink:hover{color:var(--ink);border-color:var(--gold)}
button.tlink{background:none;border:0;border-bottom:1px solid var(--gold-soft);cursor:pointer}
button.tlink:hover{color:var(--ink);border-bottom-color:var(--gold)}

/* ============ ПОЯВЛЕНИЕ ПРИ СКРОЛЛЕ ============ */
.rv{opacity:0;transform:translateY(26px);transition:opacity .9s ease,transform .95s var(--ease)}
.rv.in{opacity:1;transform:none}

/* ============ ШАПКА ============ */
.header{position:fixed;inset:0 0 auto;z-index:80;color:#fff;transition:background .45s ease,color .45s ease,box-shadow .45s ease;
  animation:hIn .9s .05s var(--ease) backwards}
@keyframes hIn{from{opacity:0;transform:translateY(-14px)}}
.hwrap{display:flex;align-items:center;gap:clamp(16px,2.4vw,34px);padding:15px clamp(16px,3vw,42px)}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none}
.brand-mark{width:40px;height:40px;flex:none;object-fit:contain}
.brand-name{display:block;font:600 15px/1 var(--serif);letter-spacing:.26em}
.brand-sub{display:block;margin-top:4px;font:600 6.5px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.nav{display:flex;gap:clamp(18px,2.2vw,32px);margin-left:auto}
.nav a{position:relative;padding:6px 0;font:600 10.5px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;text-decoration:none;opacity:.85;transition:opacity .3s}
.nav a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:right;transition:transform .5s var(--ease)}
.nav a:hover{opacity:1}
.nav a:hover::after{transform:scaleX(1);transform-origin:left}
.hphone{font:500 12.5px/1 var(--sans);letter-spacing:.06em;text-decoration:none;opacity:.9;transition:opacity .3s}
.hphone:hover{opacity:1}
.hcta{height:44px;padding:0 22px;font-size:10px;border-color:rgba(255,255,255,.5);color:#fff}
.hcta:hover{background:var(--gold);border-color:var(--gold);color:#171717}
.header.scrolled{background:rgba(245,242,236,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:var(--ink);box-shadow:0 1px 0 var(--line)}
.header.scrolled .hcta{border-color:rgba(32,32,32,.35);color:var(--ink)}
.header.scrolled .hcta:hover{background:var(--gold);border-color:var(--gold);color:#171717}
.burger{display:none;flex-direction:column;gap:5px;background:none;border:0;padding:10px 6px;cursor:pointer;color:inherit}
.burger span{display:block;width:24px;height:1.5px;background:currentColor}

/* ============ МОБИЛЬНОЕ МЕНЮ ============ */
.mm{position:fixed;inset:0;z-index:95;background:var(--graphite);color:var(--milk);display:flex;flex-direction:column;
  padding:18px clamp(20px,6vw,44px) 40px;opacity:0;visibility:hidden;transform:translateY(-12px);
  transition:opacity .45s ease,transform .45s ease,visibility 0s .45s}
.mm.open{opacity:1;visibility:visible;transform:none;transition:opacity .45s ease,transform .45s ease}
.mm-top{display:flex;justify-content:space-between;align-items:center;padding-bottom:22px;border-bottom:1px solid var(--line-l)}
.mm-x{width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:none;border:1px solid var(--line-l);color:var(--milk);cursor:pointer;transition:border-color .3s,color .3s}
.mm-x:hover{border-color:var(--gold);color:var(--gold)}
.mm-nav{display:flex;flex-direction:column;margin-top:6vh}
.mm-nav a{display:flex;align-items:baseline;gap:18px;padding:15px 0;font:500 clamp(1.7rem,7vw,2.4rem)/1.15 var(--serif);
  text-transform:uppercase;letter-spacing:.04em;text-decoration:none;border-bottom:1px solid var(--line-l);
  opacity:0;transform:translateY(22px);transition:opacity .6s ease,transform .6s var(--ease)}
.mm.open .mm-nav a{opacity:1;transform:none}
.mm-nav .mm-i{font:italic 400 14px var(--serif);color:var(--gold)}
.mm-foot{margin-top:auto;display:flex;flex-direction:column;gap:9px;font-size:14px;color:rgba(245,242,236,.75)}
.mm-foot a{color:var(--gold);text-decoration:none}
.mm-cta{margin-top:22px}

/* ============ HERO ============ */
.hero{position:relative;min-height:100vh;min-height:100svh;display:flex;color:#fff;overflow:hidden;background:var(--graphite)}
.hero-bg{position:absolute;inset:0 0 -12% 0;will-change:transform}
.hero-bg img{width:100%;height:100%;object-fit:cover;animation:kb 38s ease-in-out infinite alternate;transform-origin:center}
@keyframes kb{from{transform:scale(1.02)}to{transform:scale(1.13)}}
.hero-veil{position:absolute;inset:0;background:
  linear-gradient(180deg,rgba(23,23,23,.6),rgba(23,23,23,.16) 42%,rgba(23,23,23,.3) 62%,rgba(23,23,23,.8)),
  linear-gradient(90deg,rgba(23,23,23,.4),rgba(23,23,23,0) 55%)}
.hero-in{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;padding-top:100px}
.hero-meta{display:flex;justify-content:space-between;gap:18px;font:600 10px/1.6 var(--sans);letter-spacing:.32em;
  text-transform:uppercase;color:rgba(255,255,255,.68);opacity:0;transition:opacity 1.1s ease 1.15s;
  /* симметричный отступ декоративных надписей от краёв экрана */
  padding-inline:clamp(6px,1.6vw,26px)}
.ready .hero-meta{opacity:1}
/* Точечный минимальный отступ контента от левого края (пункт 2 предыдущего ТЗ) */
.hero-main{margin-top:auto;padding:56px 0 30px 2px}
.hero-title{font:500 clamp(2rem,10.5vw,7.2rem)/1.05 var(--serif);letter-spacing:.005em;margin-bottom:28px}
.hero-title .line{display:block;overflow:hidden;padding-bottom:.07em;margin-bottom:-.07em}
.hero-title .line>span{display:inline-block;transform:translateY(115%);transition:transform 1.2s var(--ease)}
.ready .hero-title .line>span{transform:none}
.hero-title .itl{font-style:italic;font-weight:400;color:var(--gold);font-size:1.05em;padding-right:.08em}
.hero-title .dot{color:var(--gold);font-style:normal}
.hero-sub{max-width:520px;font-size:clamp(14.5px,1.25vw,16.5px);line-height:1.85;color:rgba(255,255,255,.86)}
.fade{opacity:0;transform:translateY(20px);transition:opacity .95s ease,transform .95s var(--ease)}
.ready .fade{opacity:1;transform:none}
.d1{transition-delay:.8s}.d2{transition-delay:.95s}.d3{transition-delay:1.35s}
.hero-cta{display:flex;gap:14px;flex-wrap:wrap;margin-top:36px}
.hero-bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;padding:24px 0 30px;border-top:1px solid rgba(255,255,255,.18);
  /* симметричный отступ от краёв */
  padding-inline:clamp(6px,1.6vw,26px)}
.hero-tags{font:600 10px/1.8 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.82)}
.hero-tags b{color:var(--gold);font-weight:600;margin:0 7px}
.hero-scroll{display:flex;flex-direction:column;align-items:flex-end;gap:10px;font:600 9.5px/1 var(--sans);letter-spacing:.3em;
  text-transform:uppercase;color:rgba(255,255,255,.7);text-decoration:none;transition:color .3s;text-align:right}
.hero-scroll:hover{color:var(--gold)}
.scroll-line{position:relative;display:block;width:1px;height:44px;background:rgba(255,255,255,.22);overflow:hidden}
.scroll-line::after{content:"";position:absolute;left:0;top:-60%;width:1px;height:60%;background:var(--gold);animation:drip 2.4s cubic-bezier(.65,0,.35,1) infinite}
@keyframes drip{to{top:110%}}

/* ============ БЕГУЩАЯ СТРОКА ============ */
.marquee{background:var(--milk);border-bottom:1px solid var(--line);overflow:hidden}
.mq-track{display:flex;width:max-content;animation:mq 42s linear infinite}
.mq-track span{display:inline-flex;align-items:center;gap:34px;padding:17px 17px 17px 34px;
  font:600 10.5px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--taupe);white-space:nowrap}
.mq-track span::after{content:"";width:5px;height:5px;background:var(--gold);transform:rotate(45deg);flex:none}
@keyframes mq{to{transform:translateX(-33.3333%)}}

/* ============ О КОМПАНИИ ============ */
.about-grid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(44px,7vw,120px);align-items:start}
.about-copy .h2{margin-bottom:30px}
.pull{margin-top:34px;padding-left:22px;border-left:2px solid var(--gold);
  font:italic 500 clamp(1.25rem,2vw,1.65rem)/1.4 var(--serif);color:var(--ink)}
.facts{margin-top:42px;border-top:1px solid var(--line)}
.fact{display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:15px 0;border-bottom:1px solid var(--line)}
.fact b{font:600 10px/1.6 var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--taupe)}
.fact span{font-size:14px;font-weight:500;color:var(--ink);text-align:right}
.about-media{position:relative}
.px-frame{position:relative;overflow:hidden;aspect-ratio:4/5;background:#E7E2D8}
.px-frame img{position:absolute;left:0;top:-9%;width:100%;height:118%;object-fit:cover;will-change:transform}
.cap{display:block;margin-top:12px;font:italic 400 13px/1.6 var(--serif);color:var(--taupe);letter-spacing:.04em}
.am-small{position:absolute;left:-10%;bottom:-52px;width:35%;aspect-ratio:1;overflow:hidden;
  border:8px solid var(--milk);box-shadow:0 30px 60px rgba(23,23,23,.16)}
.am-small img{width:100%;height:100%;object-fit:cover}

/* ============ УСЛУГИ ============ */
.sec-white{background:#fff}
.head2{display:flex;justify-content:space-between;align-items:flex-end;gap:36px;flex-wrap:wrap}
.head2 .lead{max-width:400px;padding-bottom:8px}
.svc-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(26px,4.5vw,72px);margin-top:clamp(44px,5vw,76px)}
.svc-even{margin-top:clamp(40px,6vw,90px)}
.svc{display:block;color:inherit;cursor:pointer}
.svc-media{position:relative;overflow:hidden;background:#E7E2D8;height:0;padding-top:133.333%;
  transition:padding-top .8s var(--ease)}
.svc-media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.svc:hover .svc-media img{transform:scale(1.055)}
.svc.open .svc-media{padding-top:70%}
.svc-num{position:absolute;top:14px;left:20px;z-index:2;font:400 clamp(2.6rem,3.4vw,3.6rem)/1 var(--serif);color:#fff;text-shadow:0 2px 26px rgba(0,0,0,.35)}
.svc-body{padding-top:24px}
.svc-head{display:flex;align-items:center;justify-content:space-between;gap:18px}
.svc-head h3{font:500 clamp(1.45rem,2vw,1.8rem)/1.15 var(--serif);text-transform:uppercase;letter-spacing:.03em;color:var(--ink)}
.svc-arrow{flex:none;width:50px;height:50px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;
  transition:background .4s,border-color .4s,color .4s,transform .5s var(--ease)}
.svc:hover .svc-arrow{background:var(--gold);border-color:var(--gold);color:#fff}
.svc.open .svc-arrow{transform:rotate(45deg);background:var(--gold);border-color:var(--gold);color:#fff}
.svc-body>p{margin-top:12px;font-size:14.5px;line-height:1.7;max-width:46ch}
/* Раскрывающаяся панель услуги */
.svc-panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .7s var(--ease);cursor:default}
.svc.open .svc-panel{grid-template-rows:1fr}
.svc-panel-in{overflow:hidden;min-height:0}
.svc-panel-body{padding-top:22px;opacity:0;transform:translateY(10px);transition:opacity .5s ease .08s,transform .5s var(--ease) .08s}
.svc.open .svc-panel-body{opacity:1;transform:none}
.svc-panel-body>p{font-size:14.5px;line-height:1.8;color:var(--body)}
.p-label{margin-top:22px;font:600 9.5px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold-deep)}
.wlist{list-style:none;margin-top:10px;border-top:1px solid var(--line)}
.wlist li{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.6;color:var(--ink)}
.wlist li::before{content:"—";color:var(--gold-deep);flex:none}
.p-actions{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-top:22px}
.svc-note{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;
  margin-top:clamp(52px,6vw,84px);padding-top:26px;border-top:1px solid var(--line);font-size:13.5px;color:var(--taupe)}

/* ============ ПРОЕКТЫ ============ */
.pf{display:flex;gap:8px;flex-wrap:wrap}
.pf button{background:none;border:1px solid var(--line);padding:12px 18px;cursor:pointer;
  font:600 10px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--taupe);
  transition:background .3s,color .3s,border-color .3s}
.pf button:hover{border-color:var(--gold);color:var(--ink)}
.pf button.on{background:var(--graphite);border-color:var(--graphite);color:var(--milk)}
.pj{display:grid;grid-template-columns:repeat(12,1fr);grid-auto-rows:clamp(44px,5.6vw,80px);gap:14px;grid-auto-flow:row dense;margin-top:clamp(38px,4vw,56px)}
.pj-item{position:relative;overflow:hidden;cursor:pointer;background:#E7E2D8;animation:tileIn .8s var(--ease) both}
@keyframes tileIn{from{opacity:0;transform:translateY(24px) scale(.985)}}
.pj-item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.pj-item:hover img{transform:scale(1.05)}
.pj-item::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(23,23,23,0) 55%,rgba(23,23,23,.58));opacity:.92;transition:opacity .5s}
.pj-item:hover::after{opacity:1}
.pj-item figcaption{position:absolute;left:22px;right:22px;bottom:17px;z-index:2;display:flex;flex-direction:column;gap:5px;color:#fff}
.pj-cat{font:600 9.5px/1 var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.pj-name{font:500 21px/1.2 var(--serif);letter-spacing:.02em}

.lb-x{position:absolute;top:22px;right:22px}
.lb button{position:absolute;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;

.step{position:relative;padding:22px 0 22px 64px}

@media(max-width:1080px){.nav,.hcta{display:none}.burger{display:flex}}
@media(max-width:960px){

/* ============ REDUCED MOTION ============ */

}

/* =====================================================================
   Фирменный знак ROYAL ORDO.
   Основной источник — оригинальное изображение images/logo.png
   (ваш PNG кладётся рядом с index.html, в папку images).

   автоматически показывается встроенная резервная эмблема —
   логотип не «ломается» никогда. variant="color" — знак для светлого
   фона (шапка при прокрутке), variant="light" — для тёмного
   (шапка поверх фото, меню, подвал).
   ===================================================================== */
const LOGO_FILE = 'images/logo.png';
const LOGO_FALLBACK = {
  light: "data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cpath%20d='M36.1%2081.9A33%2033%200%201%201%2063.9%2081.9'%20fill='none'%20stroke='%23F5F2EC'%20stroke-width='7'/%3E%3Cpath%20d='M33.5%2049%2041%2046v36h-7.5z'%20fill='%23D2A862'/%3E%3Cpath%20d='M66.5%2049%2059%2046v36h7.5z'%20fill='%23D2A862'/%3E%3Cpath%20d='M43.5%2040%2049.2%2032v50h-5.7z'%20fill='%23F5F2EC'/%3E%3Cpath%20d='M56.5%2040%2050.8%2032v50h5.7z'%20fill='%23F5F2EC'/%3E%3C/svg%3E",
  color: "data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Cpath%20d='M36.1%2081.9A33%2033%200%201%201%2063.9%2081.9'%20fill='none'%20stroke='%235B5347'%20stroke-width='7'/%3E%3Cpath%20d='M33.5%2049%2041%2046v36h-7.5z'%20fill='%23D9A45B'/%3E%3Cpath%20d='M66.5%2049%2059%2046v36h7.5z'%20fill='%23D9A45B'/%3E%3Cpath%20d='M43.5%2040%2049.2%2032v50h-5.7z'%20fill='%235B5347'/%3E%3Cpath%20d='M56.5%2040%2050.8%2032v50h5.7z'%20fill='%235B5347'/%3E%3C/svg%3E"
};
const LogoMark = ({ className, variant = 'light' }) => {
  const [failed, setFailed] = useState(false);
  const src = failed ? LOGO_FALLBACK[variant] : LOGO_FILE;
  return (
    <img src={src} className={className} alt="Логотип ROYAL ORDO" decoding="async"
         onError={() => setFailed(true)}/>
  );
};

/* ============ УТИЛИТЫ ============ */
/* Изображение с резервным источником: если фото недоступно — подменяется,
   чтобы демо никогда не выглядело «сломанным». */
function Img({ src, seed = 'ordo', alt = '', className = '', eager = false, draggable = true }) {
  const [cur, setCur] = useState(src);
  const [dead, setDead] = useState(false);
  useEffect(() => { setCur(src); setDead(false); }, [src]);
  if (dead) return <div className={'ph ' + className} role="img" aria-label={alt}/>;
  return (
    <img src={cur} alt={alt} className={className} loading={eager ? 'eager' : 'lazy'} decoding="async"
         draggable={draggable} onError={() => { if (cur !== FB(seed)) setCur(FB(seed)); else setDead(true); }}/>
  );
}

/* Плавное появление блоков при попадании в зону просмотра */
function Reveal({ children, className = '', delay = 0 }) {
  const ref = useRef(null);
  const [vis, setVis] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    if (reduced()) { setVis(true); return; }
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting) { setVis(true); io.disconnect(); }
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    io.observe(el);
    return () => io.disconnect();
  }, []);
  return (
    <div ref={ref} className={'rv' + (vis ? ' in ' : ' ') + className} style={{ transitionDelay: delay + 'ms' }}>
      {children}
    </div>
  );
}

/* Лёгкий параллакс изображения внутри кадра */
function useParallax(frameRef, k = 0.07) {
  useEffect(() => {
    if (reduced()) return;
    let raf = 0;
    const on = () => {
      if (raf) return;
      raf = requestAnimationFrame(() => {
        raf = 0;
        const el = frameRef.current;
        if (!el) return;
        const img = el.querySelector('img');
        if (!img) return;
        const r = el.getBoundingClientRect();
        if (r.bottom < -80 || r.top > innerHeight + 80) return;
        const c = r.top + r.height / 2 - innerHeight / 2;
        img.style.transform = 'translate3d(0,' + (-c * k).toFixed(1) + 'px,0)';
      });
    };
    on();
    addEventListener('scroll', on, { passive: true });
    addEventListener('resize', on);
    return () => { removeEventListener('scroll', on); removeEventListener('resize', on); if (raf) cancelAnimationFrame(raf); };
  }, []);
}

      <button className="lb-next" onClick={(e) => { e.stopPropagation(); onNav(1); }} aria-label="Следующее изображение"><IcChevR s={20}/></button>

function Projects() {

    <section className="sec" id="projects">
      <div className="container">

                    onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); setLb(i); } }}>
              <Img src={U(p.img, 1400)} seed={'pj-' + p.id} alt={p.alt}/>
              <figcaption>
                <span className="pj-cat">{p.cat}</span>
                <span className="pj-name">{p.title}</span>
              </figcaption>
            </figure>
          ))}
        </div>
        <Reveal>
          <p className="pj-note">* Пример оформления портфолио. На демонстрационной версии использованы стоковые изображения — они будут заменены реальными проектами ROYAL ORDO.</p>
        </Reveal>
      </div>
      {lb >= 0 && <Lightbox items={list} index={lb} onClose={() => setLb(-1)} onNav={(d) => setLb((v) => (v + d + list.length) % list.length)}/>}

  );
}

/* ============ ДО / ПОСЛЕ ============ */
function BeforeAfter() {
  const [pos, setPos] = useState(50);
  const frame = useRef(null);
  const drag = useRef(false);
  const intro = useRef(false);
  useEffect(() => {
    if (reduced()) return;
    const io = new IntersectionObserver(([e]) => {
      if (e.isIntersecting && !intro.current) {
        intro.current = true;
        const t0 = performance.now(), from = 18, to = 50, D = 1200;
        const step = (t) => {
          const p = Math.min(1, (t - t0) / D);
          setPos(from + (to - from) * (1 - Math.pow(1 - p, 3)));
          if (p < 1) requestAnimationFrame(step);
        };
        requestAnimationFrame(step);
      }
    }, { threshold: 0.35 });
    if (frame.current) io.observe(frame.current);
    return () => io.disconnect();
  }, []);
  const setFrom = (x) => {
    const el = frame.current;
    if (!el) return;
    const r = el.getBoundingClientRect();
    setPos(Math.min(96, Math.max(4, ((x - r.left) / r.width) * 100)));
  };
  const onKey = (e) => {
    const map = { ArrowLeft: -4, ArrowRight: 4 };
    if (e.key in map) { e.preventDefault(); setPos((p) => Math.min(96, Math.max(4, p + map[e.key]))); }
    if (e.key === 'Home') { e.preventDefault(); setPos(4); }
    if (e.key === 'End') { e.preventDefault(); setPos(96); }
  };
  return (
    <section className="sec" id="before-after">
      <div className="container">
        <div className="head2">
          <div>
            <Reveal><div className="overline"><span className="oi">04</span>До и после</div></Reveal>
            <Reveal delay={80}><h2 className="h2">От черновой квартиры —<br/><em>к готовому дому.</em></h2></Reveal>
          </div>
          <Reveal delay={160}><p className="lead">Перетащите разделитель мышью или пальцем — либо используйте клавиши со стрелками.</p></Reveal>
        </div>
        <Reveal delay={120}>
          <div className="ba-wrap">
            <div className="ba" ref={frame}
                 onPointerDown={(e) => { drag.current = true; if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId); setFrom(e.clientX); }}
                 onPointerMove={(e) => { if (drag.current) setFrom(e.clientX); }}
                 onPointerUp={() => { drag.current = false; }}
                 onPointerCancel={() => { drag.current = false; }}>
              <Img className="ba-img" src={IMAGES.after} seed="ba-after" alt="Интерьер после ремонта — демонстрационное изображение"/>
              <div className="ba-before" style={{ clipPath: 'inset(0 ' + (100 - pos) + '% 0 0)' }}>
                <Img className="ba-img" src={IMAGES.before} seed="ba-before" eager alt="Помещение до ремонта — демонстрационное изображение"/>
              </div>
              <span className={'ba-lb l' + (pos < 86 ? '' : ' hide')}>До</span>
              <span className={'ba-lb r' + (pos > 14 ? '' : ' hide')}>После</span>
              <div className="ba-line" style={{ left: pos + '%' }} aria-hidden="true">
                <button className="ba-handle" role="slider" tabIndex={0}
                        aria-label="Сравнение «до и после»" aria-valuemin={0} aria-valuemax={100} aria-valuenow={Math.round(pos)}
                        onKeyDown={onKey}>
                  <IcLR s={20}/>
                </button>
              </div>
            </div>
            <div className="ba-foot">
              <em>Демонстрационный пример: пара стоковых фотографий похожей геометрии, а не документация объекта ROYAL ORDO. Перед публикацией заменим реальными фото «до/после».</em>
              <span>Слева — «до», справа — «после»</span>
            </div>
          </div>
        </Reveal>
      </div>
    </section>
  );
}

/* ============ ПОЧЕМУ ROYAL ORDO ============ */
function Advantages() {

/* ============ ЭТАПЫ РАБОТЫ (временная шкала) ============ */
function Steps() {
  const sec = useRef(null);
  const fill = useRef(null);
  useEffect(() => {
    const on = () => {
      const el = sec.current;
      if (!el || !fill.current) return;
      const r = el.getBoundingClientRect();
      const passed = Math.min(Math.max(innerHeight * 0.72 - r.top, 0), r.height);
      fill.current.style.height = (passed / r.height * 100).toFixed(2) + '%';
      el.querySelectorAll('.step').forEach((s) => {
        s.classList.toggle('on', s.getBoundingClientRect().top < innerHeight * 0.72);
      });
    };
    on();
    addEventListener('scroll', on, { passive: true });
    addEventListener('resize', on);
    return () => { removeEventListener('scroll', on); removeEventListener('resize', on); };
  }, []);
  return (
    <section className="sec" id="steps">
      <div className="container steps-grid">
        <div className="steps-left">
          <Reveal><div className="overline"><span className="oi">06</span>Этапы работы</div></Reveal>
          <Reveal delay={80}><h2 className="h2">От первого разговора — <em>до передачи ключей.</em></h2></Reveal>
          <Reveal delay={160}>
            <p className="lead">Шесть понятных шагов. На каждом этапе вы знаете, что происходит на объекте и что будет дальше.</p>
          </Reveal>
          <Reveal delay={220}>
            <a className="tlink" href={waLink()} target="_blank" rel="noopener">Начать с шага 01 <IcUpRight s={14}/></a>
          </Reveal>
        </div>
        <div className="tl" ref={sec}>
          <span className="tl-fill" ref={fill} aria-hidden="true"></span>
          {STEPS.map((s, i) => (
            <Reveal key={s.n} delay={i * 60}>
              <div className="step">
                <span className="tl-dot" aria-hidden="true"></span>
                <span className="step-n">{s.n}</span>
                <h3>{s.title}</h3>
                <p>{s.desc}</p>
              </div>
            </Reveal>
          ))}
        </div>
      </div>
    </section>
  );
}
